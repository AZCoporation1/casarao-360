<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#150c07"/>
      <stop offset="0.55" stop-color="#0d0805"/>
      <stop offset="1" stop-color="#090706"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.5" cy="1.05" r="0.9">
      <stop offset="0" stop-color="#B32616" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#B32616" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#B32616" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberHalo" cx="0.62" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8E7C9" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F8E7C9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A2414" stop-opacity="0"/>
      <stop offset="1" stop-color="#4A2414" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.97 0 0 0 0 0.9 0 0 0 0 0.78 0 0 0 0.05 0"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#ember)"/>
  <rect width="800" height="500" fill="url(#amberHalo)"/>

  <!-- Luzes de palco -->
  <polygon points="150,-10 90,300 330,300" fill="url(#beam)"/>
  <polygon points="620,-10 470,320 760,320" fill="url(#beam)"/>

  <!-- Motivo fantasma (textura de fundo) -->
  <g opacity="0.06" transform="translate(400 250) scale(2.6) translate(-400 -250)" stroke="#F8E7C9" fill="none">
    
  <g transform="translate(440 170)">
    <rect x="0" y="0" width="220" height="150" rx="12" stroke="#F8E7C9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="16" y="52" width="188" height="84" rx="8" stroke="#F8E7C9" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-width="3.5" stroke-opacity="0.7"/>
    <g stroke="#F8E7C9" stroke-width="2.5" stroke-opacity="0.5">
      <line x1="36" y1="52" x2="36" y2="136"/><line x1="66" y1="52" x2="66" y2="136"/>
      <line x1="96" y1="52" x2="96" y2="136"/><line x1="126" y1="52" x2="126" y2="136"/>
      <line x1="156" y1="52" x2="156" y2="136"/><line x1="186" y1="52" x2="186" y2="136"/>
    </g>
    <circle cx="40" cy="28" r="8" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="70" cy="28" r="8" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="100" cy="28" r="8" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="130" cy="28" r="8" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <path d="M680 168 q22 -34 8 -62 q34 22 30 62 q-2 26 -26 38 q10 -20 -12 -38 z" fill="#F97316" stroke="none"/>
  </g>

  

  <!-- Motivo principal -->
  <g filter="url(#glow)">
    
  <g transform="translate(440 170)">
    <rect x="0" y="0" width="220" height="150" rx="12" stroke="#F8E7C9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="16" y="52" width="188" height="84" rx="8" stroke="#F8E7C9" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-width="3.5" stroke-opacity="0.7"/>
    <g stroke="#F8E7C9" stroke-width="2.5" stroke-opacity="0.5">
      <line x1="36" y1="52" x2="36" y2="136"/><line x1="66" y1="52" x2="66" y2="136"/>
      <line x1="96" y1="52" x2="96" y2="136"/><line x1="126" y1="52" x2="126" y2="136"/>
      <line x1="156" y1="52" x2="156" y2="136"/><line x1="186" y1="52" x2="186" y2="136"/>
    </g>
    <circle cx="40" cy="28" r="8" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="70" cy="28" r="8" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="100" cy="28" r="8" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="130" cy="28" r="8" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <path d="M680 168 q22 -34 8 -62 q34 22 30 62 q-2 26 -26 38 q10 -20 -12 -38 z" fill="#F97316" stroke="none"/>
  </g>

  <circle cx="211.5" cy="163.6" r="2.8" fill="#F97316" opacity="0.33"/><circle cx="367.1" cy="379.5" r="2.8" fill="#F59E0B" opacity="0.16"/><circle cx="142.5" cy="194.3" r="2.1" fill="#F97316" opacity="0.33"/><circle cx="659.9" cy="225.4" r="2.3" fill="#F97316" opacity="0.54"/><circle cx="614.9" cy="189.2" r="1.4" fill="#F97316" opacity="0.16"/><circle cx="196.4" cy="430.4" r="1.1" fill="#F59E0B" opacity="0.27"/><circle cx="446.6" cy="144.1" r="1.1" fill="#F59E0B" opacity="0.52"/><circle cx="221.1" cy="291.4" r="0.9" fill="#F59E0B" opacity="0.40"/><circle cx="108.7" cy="327.9" r="1.6" fill="#F59E0B" opacity="0.31"/><circle cx="351.7" cy="266.6" r="1.6" fill="#F97316" opacity="0.32"/><circle cx="685.6" cy="392.9" r="1.4" fill="#F97316" opacity="0.46"/><circle cx="659.3" cy="233.6" r="1.9" fill="#F97316" opacity="0.49"/><circle cx="435.1" cy="299.5" r="1.8" fill="#F97316" opacity="0.42"/><circle cx="628.4" cy="200.3" r="0.9" fill="#F59E0B" opacity="0.38"/><circle cx="468.2" cy="174.2" r="1.9" fill="#F97316" opacity="0.39"/><circle cx="756.8" cy="269.4" r="1.9" fill="#F59E0B" opacity="0.40"/><circle cx="109.6" cy="380.3" r="1.8" fill="#F59E0B" opacity="0.20"/><circle cx="315.5" cy="176.2" r="1.9" fill="#F97316" opacity="0.50"/><circle cx="656.8" cy="203.0" r="2.1" fill="#F97316" opacity="0.31"/><circle cx="629.1" cy="319.6" r="2.1" fill="#F59E0B" opacity="0.41"/><circle cx="261.1" cy="266.3" r="2.1" fill="#F59E0B" opacity="0.41"/><circle cx="195.2" cy="127.0" r="2.5" fill="#F59E0B" opacity="0.18"/><circle cx="86.9" cy="364.8" r="1.9" fill="#F97316" opacity="0.14"/><circle cx="365.0" cy="151.3" r="2.7" fill="#F59E0B" opacity="0.16"/><circle cx="151.9" cy="388.0" r="1.1" fill="#F97316" opacity="0.50"/><circle cx="703.0" cy="222.6" r="1.5" fill="#F97316" opacity="0.33"/>

  <rect width="800" height="500" fill="url(#floor)"/>
  <rect width="800" height="500" filter="url(#grain)"/>

  <!-- Moldura e assinatura da casa -->
  <rect x="14" y="14" width="772" height="472" rx="14" fill="none" stroke="#F8E7C9" stroke-opacity="0.14" stroke-width="1.5"/>
  <g font-family="Montserrat, Arial, sans-serif">
    <text x="40" y="448" fill="#F8E7C9" fill-opacity="0.85" font-size="19" font-weight="700" letter-spacing="6">O CASARÃO</text>
    <text x="40" y="468" fill="#F59E0B" fill-opacity="0.7" font-size="10.5" font-weight="600" letter-spacing="4.2">EXPERIÊNCIAS AO VIVO</text>
  </g>
</svg>