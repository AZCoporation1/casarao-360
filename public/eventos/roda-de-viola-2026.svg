<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#150c07"/>
      <stop offset="0.55" stop-color="#0d0805"/>
      <stop offset="1" stop-color="#090706"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.5" cy="1.05" r="0.9">
      <stop offset="0" stop-color="#B32616" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#B32616" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#B32616" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberHalo" cx="0.62" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8E7C9" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F8E7C9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A2414" stop-opacity="0"/>
      <stop offset="1" stop-color="#4A2414" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.97 0 0 0 0 0.9 0 0 0 0 0.78 0 0 0 0.05 0"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#ember)"/>
  <rect width="800" height="500" fill="url(#amberHalo)"/>

  <!-- Luzes de palco -->
  <polygon points="150,-10 90,300 330,300" fill="url(#beam)"/>
  <polygon points="620,-10 470,320 760,320" fill="url(#beam)"/>

  <!-- Motivo fantasma (textura de fundo) -->
  <g opacity="0.06" transform="translate(400 250) scale(2.6) translate(-400 -250)" stroke="#F8E7C9" fill="none">
    
  <circle cx="500" cy="235" r="150" stroke="#F8E7C9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-opacity="0.35" stroke-dasharray="4 22"/>
  <path d="M470 300 q-52 8 -58 -34 q-4 -28 22 -38 q-14 -12 -6 -30 q8 -18 30 -16 l10 2 L520 120" stroke="#F8E7C9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M520 120 l14 -24 q4 -7 12 -3 l16 10 q7 5 2 12 l-15 23" stroke="#F8E7C9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="462" cy="252" r="14" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="452" y1="286" x2="524" y2="140" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.9"/>
  <line x1="466" y1="292" x2="536" y2="148" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.9"/>
  <path d="M612 128 a34 34 0 1 0 20 60 a28 28 0 1 1 -20 -60" fill="#F8E7C9" fill-opacity="0.8" stroke="none"/>
  </g>

  

  <!-- Motivo principal -->
  <g filter="url(#glow)">
    
  <circle cx="500" cy="235" r="150" stroke="#F8E7C9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-opacity="0.35" stroke-dasharray="4 22"/>
  <path d="M470 300 q-52 8 -58 -34 q-4 -28 22 -38 q-14 -12 -6 -30 q8 -18 30 -16 l10 2 L520 120" stroke="#F8E7C9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M520 120 l14 -24 q4 -7 12 -3 l16 10 q7 5 2 12 l-15 23" stroke="#F8E7C9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="462" cy="252" r="14" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="452" y1="286" x2="524" y2="140" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.9"/>
  <line x1="466" y1="292" x2="536" y2="148" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.9"/>
  <path d="M612 128 a34 34 0 1 0 20 60 a28 28 0 1 1 -20 -60" fill="#F8E7C9" fill-opacity="0.8" stroke="none"/>
  </g>

  <circle cx="507.9" cy="409.4" r="1.5" fill="#F97316" opacity="0.17"/><circle cx="586.8" cy="182.3" r="1.5" fill="#F97316" opacity="0.48"/><circle cx="485.5" cy="389.8" r="2.9" fill="#F97316" opacity="0.35"/><circle cx="366.3" cy="262.3" r="2.1" fill="#F59E0B" opacity="0.24"/><circle cx="124.7" cy="369.8" r="0.9" fill="#F97316" opacity="0.26"/><circle cx="429.5" cy="310.3" r="2.2" fill="#F97316" opacity="0.45"/><circle cx="643.0" cy="132.2" r="0.9" fill="#F59E0B" opacity="0.30"/><circle cx="100.8" cy="369.8" r="2.2" fill="#F97316" opacity="0.50"/><circle cx="591.8" cy="372.3" r="2.1" fill="#F97316" opacity="0.42"/><circle cx="678.1" cy="365.8" r="2.6" fill="#F97316" opacity="0.41"/><circle cx="575.3" cy="209.1" r="1.3" fill="#F97316" opacity="0.35"/><circle cx="312.4" cy="282.4" r="2.7" fill="#F97316" opacity="0.30"/><circle cx="531.4" cy="349.7" r="2.8" fill="#F59E0B" opacity="0.14"/><circle cx="168.1" cy="234.3" r="2.6" fill="#F97316" opacity="0.27"/><circle cx="371.3" cy="387.4" r="2.1" fill="#F97316" opacity="0.14"/><circle cx="263.2" cy="430.8" r="1.9" fill="#F59E0B" opacity="0.43"/><circle cx="379.3" cy="152.1" r="2.1" fill="#F59E0B" opacity="0.33"/><circle cx="108.6" cy="393.8" r="2.5" fill="#F97316" opacity="0.40"/><circle cx="653.2" cy="315.5" r="2.0" fill="#F97316" opacity="0.41"/><circle cx="548.8" cy="309.1" r="2.0" fill="#F97316" opacity="0.54"/><circle cx="304.2" cy="328.4" r="2.0" fill="#F97316" opacity="0.25"/><circle cx="321.6" cy="350.5" r="1.4" fill="#F97316" opacity="0.14"/><circle cx="736.6" cy="412.1" r="2.7" fill="#F97316" opacity="0.50"/><circle cx="298.1" cy="217.8" r="3.0" fill="#F59E0B" opacity="0.15"/><circle cx="48.3" cy="242.7" r="2.2" fill="#F59E0B" opacity="0.54"/><circle cx="282.8" cy="167.7" r="1.9" fill="#F97316" opacity="0.25"/>

  <rect width="800" height="500" fill="url(#floor)"/>
  <rect width="800" height="500" filter="url(#grain)"/>

  <!-- Moldura e assinatura da casa -->
  <rect x="14" y="14" width="772" height="472" rx="14" fill="none" stroke="#F8E7C9" stroke-opacity="0.14" stroke-width="1.5"/>
  <g font-family="Montserrat, Arial, sans-serif">
    <text x="40" y="448" fill="#F8E7C9" fill-opacity="0.85" font-size="19" font-weight="700" letter-spacing="6">O CASARÃO</text>
    <text x="40" y="468" fill="#F59E0B" fill-opacity="0.7" font-size="10.5" font-weight="600" letter-spacing="4.2">EXPERIÊNCIAS AO VIVO</text>
  </g>
</svg>