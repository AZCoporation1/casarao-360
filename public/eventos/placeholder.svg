<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#150c07"/>
      <stop offset="0.55" stop-color="#0d0805"/>
      <stop offset="1" stop-color="#090706"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.5" cy="1.05" r="0.9">
      <stop offset="0" stop-color="#B32616" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#B32616" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#B32616" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberHalo" cx="0.62" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8E7C9" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F8E7C9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A2414" stop-opacity="0"/>
      <stop offset="1" stop-color="#4A2414" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.97 0 0 0 0 0.9 0 0 0 0 0.78 0 0 0 0.05 0"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#ember)"/>
  <rect width="800" height="500" fill="url(#amberHalo)"/>

  <!-- Luzes de palco -->
  <polygon points="150,-10 90,300 330,300" fill="url(#beam)"/>
  <polygon points="620,-10 470,320 760,320" fill="url(#beam)"/>

  <!-- Motivo fantasma (textura de fundo) -->
  <g opacity="0.06" transform="translate(400 250) scale(2.6) translate(-400 -250)" stroke="#F8E7C9" fill="none">
    
  <g transform="translate(540 200)">
    <path d="M-120 40 L0 -60 L120 40" stroke="#F8E7C9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="-100" y="40" width="200" height="120" stroke="#F8E7C9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="-24" y="96" width="48" height="64" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="-78" y="64" width="32" height="40" stroke="#F8E7C9" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-width="4"/>
    <rect x="46" y="64" width="32" height="40" stroke="#F8E7C9" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-width="4"/>
    <circle cx="0" cy="6" r="12" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  </g>

  

  <!-- Motivo principal -->
  <g filter="url(#glow)">
    
  <g transform="translate(540 200)">
    <path d="M-120 40 L0 -60 L120 40" stroke="#F8E7C9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="-100" y="40" width="200" height="120" stroke="#F8E7C9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="-24" y="96" width="48" height="64" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="-78" y="64" width="32" height="40" stroke="#F8E7C9" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-width="4"/>
    <rect x="46" y="64" width="32" height="40" stroke="#F8E7C9" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-width="4"/>
    <circle cx="0" cy="6" r="12" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  </g>

  <circle cx="393.1" cy="299.5" r="1.1" fill="#F97316" opacity="0.23"/><circle cx="404.6" cy="145.1" r="2.7" fill="#F97316" opacity="0.39"/><circle cx="244.8" cy="370.0" r="2.2" fill="#F97316" opacity="0.15"/><circle cx="209.3" cy="335.0" r="1.1" fill="#F97316" opacity="0.37"/><circle cx="166.9" cy="136.0" r="2.9" fill="#F97316" opacity="0.56"/><circle cx="359.8" cy="425.8" r="1.2" fill="#F97316" opacity="0.31"/><circle cx="523.7" cy="209.9" r="1.2" fill="#F97316" opacity="0.56"/><circle cx="207.5" cy="295.1" r="1.5" fill="#F59E0B" opacity="0.19"/><circle cx="293.2" cy="232.0" r="1.0" fill="#F97316" opacity="0.54"/><circle cx="676.6" cy="270.6" r="1.3" fill="#F97316" opacity="0.39"/><circle cx="586.4" cy="328.9" r="1.1" fill="#F97316" opacity="0.22"/><circle cx="104.9" cy="135.2" r="1.7" fill="#F59E0B" opacity="0.43"/><circle cx="727.7" cy="224.0" r="1.8" fill="#F97316" opacity="0.34"/><circle cx="643.7" cy="264.2" r="1.8" fill="#F97316" opacity="0.24"/><circle cx="575.0" cy="162.2" r="1.4" fill="#F59E0B" opacity="0.46"/><circle cx="737.2" cy="416.6" r="2.7" fill="#F59E0B" opacity="0.46"/><circle cx="439.3" cy="127.7" r="1.5" fill="#F97316" opacity="0.28"/><circle cx="323.4" cy="339.5" r="2.4" fill="#F59E0B" opacity="0.24"/><circle cx="45.0" cy="235.1" r="2.1" fill="#F97316" opacity="0.32"/><circle cx="753.2" cy="266.0" r="2.7" fill="#F97316" opacity="0.38"/><circle cx="130.1" cy="373.8" r="2.8" fill="#F97316" opacity="0.24"/><circle cx="151.2" cy="346.3" r="2.3" fill="#F59E0B" opacity="0.42"/><circle cx="205.5" cy="385.8" r="1.2" fill="#F97316" opacity="0.14"/><circle cx="55.1" cy="291.9" r="2.6" fill="#F97316" opacity="0.50"/><circle cx="395.7" cy="136.7" r="1.4" fill="#F97316" opacity="0.34"/><circle cx="296.1" cy="193.7" r="1.5" fill="#F97316" opacity="0.48"/>

  <rect width="800" height="500" fill="url(#floor)"/>
  <rect width="800" height="500" filter="url(#grain)"/>

  <!-- Moldura e assinatura da casa -->
  <rect x="14" y="14" width="772" height="472" rx="14" fill="none" stroke="#F8E7C9" stroke-opacity="0.14" stroke-width="1.5"/>
  <g font-family="Montserrat, Arial, sans-serif">
    <text x="40" y="448" fill="#F8E7C9" fill-opacity="0.85" font-size="19" font-weight="700" letter-spacing="6">O CASARÃO</text>
    <text x="40" y="468" fill="#F59E0B" fill-opacity="0.7" font-size="10.5" font-weight="600" letter-spacing="4.2">EXPERIÊNCIAS AO VIVO</text>
  </g>
</svg>