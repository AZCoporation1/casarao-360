<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#150c07"/>
      <stop offset="0.55" stop-color="#0d0805"/>
      <stop offset="1" stop-color="#090706"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.5" cy="1.05" r="0.9">
      <stop offset="0" stop-color="#B32616" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#B32616" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#B32616" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberHalo" cx="0.62" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8E7C9" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F8E7C9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A2414" stop-opacity="0"/>
      <stop offset="1" stop-color="#4A2414" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.97 0 0 0 0 0.9 0 0 0 0 0.78 0 0 0 0.05 0"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#ember)"/>
  <rect width="800" height="500" fill="url(#amberHalo)"/>

  <!-- Luzes de palco -->
  <polygon points="150,-10 90,300 330,300" fill="url(#beam)"/>
  <polygon points="620,-10 470,320 760,320" fill="url(#beam)"/>

  <!-- Motivo fantasma (textura de fundo) -->
  <g opacity="0.06" transform="translate(400 250) scale(2.6) translate(-400 -250)" stroke="#F8E7C9" fill="none">
    
  <g stroke="#F8E7C9" stroke-opacity="0.3" stroke-width="2">
    <line x1="380" y1="344" x2="720" y2="344"/>
    <line x1="400" y1="368" x2="700" y2="368"/>
    <line x1="470" y1="344" x2="460" y2="392"/><line x1="560" y1="344" x2="560" y2="392"/><line x1="650" y1="344" x2="662" y2="392"/>
  </g>
  <g transform="translate(540 168)">
    <ellipse cx="0" cy="30" rx="86" ry="18" stroke="#F8E7C9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M-46 24 q-6 -58 46 -58 q52 0 46 58" stroke="#F8E7C9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M-46 12 q46 18 92 0" stroke="#F59E0B" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  <path d="M448 300 q-2 -26 22 -28 l6 -22 q2 -8 10 -6 q8 2 6 10 l-4 20 8 2 6 -24 q2 -8 10 -6 q8 2 6 10 l-6 24 10 4 q22 10 12 34 l-8 18 -74 -18 z" fill="#F8E7C9" fill-opacity="0.9" stroke="none"/>
  <path d="M430 252 L432.8 259.2 L440 262 L432.8 264.8 L430 272 L427.2 264.8 L420 262 L427.2 259.2 Z" fill="#F59E0B" fill-opacity="1" stroke="none"/> <path d="M548 310 L550.24 315.76 L556 318 L550.24 320.24 L548 326 L545.76 320.24 L540 318 L545.76 315.76 Z" fill="#F59E0B" fill-opacity="0.8" stroke="none"/> <path d="M474 240 L475.68 244.32 L480 246 L475.68 247.68 L474 252 L472.32 247.68 L468 246 L472.32 244.32 Z" fill="#F59E0B" fill-opacity="0.7" stroke="none"/>
  </g>

  

  <!-- Motivo principal -->
  <g filter="url(#glow)">
    
  <g stroke="#F8E7C9" stroke-opacity="0.3" stroke-width="2">
    <line x1="380" y1="344" x2="720" y2="344"/>
    <line x1="400" y1="368" x2="700" y2="368"/>
    <line x1="470" y1="344" x2="460" y2="392"/><line x1="560" y1="344" x2="560" y2="392"/><line x1="650" y1="344" x2="662" y2="392"/>
  </g>
  <g transform="translate(540 168)">
    <ellipse cx="0" cy="30" rx="86" ry="18" stroke="#F8E7C9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M-46 24 q-6 -58 46 -58 q52 0 46 58" stroke="#F8E7C9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M-46 12 q46 18 92 0" stroke="#F59E0B" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  <path d="M448 300 q-2 -26 22 -28 l6 -22 q2 -8 10 -6 q8 2 6 10 l-4 20 8 2 6 -24 q2 -8 10 -6 q8 2 6 10 l-6 24 10 4 q22 10 12 34 l-8 18 -74 -18 z" fill="#F8E7C9" fill-opacity="0.9" stroke="none"/>
  <path d="M430 252 L432.8 259.2 L440 262 L432.8 264.8 L430 272 L427.2 264.8 L420 262 L427.2 259.2 Z" fill="#F59E0B" fill-opacity="1" stroke="none"/> <path d="M548 310 L550.24 315.76 L556 318 L550.24 320.24 L548 326 L545.76 320.24 L540 318 L545.76 315.76 Z" fill="#F59E0B" fill-opacity="0.8" stroke="none"/> <path d="M474 240 L475.68 244.32 L480 246 L475.68 247.68 L474 252 L472.32 247.68 L468 246 L472.32 244.32 Z" fill="#F59E0B" fill-opacity="0.7" stroke="none"/>
  </g>

  <circle cx="414.8" cy="148.8" r="2.1" fill="#F97316" opacity="0.38"/><circle cx="267.1" cy="212.1" r="1.7" fill="#F97316" opacity="0.41"/><circle cx="499.1" cy="425.4" r="1.4" fill="#F59E0B" opacity="0.34"/><circle cx="313.2" cy="232.7" r="1.4" fill="#F59E0B" opacity="0.48"/><circle cx="84.9" cy="417.3" r="2.6" fill="#F97316" opacity="0.36"/><circle cx="243.0" cy="150.4" r="0.9" fill="#F97316" opacity="0.31"/><circle cx="629.9" cy="333.8" r="1.1" fill="#F97316" opacity="0.12"/><circle cx="341.0" cy="435.1" r="1.1" fill="#F97316" opacity="0.33"/><circle cx="205.3" cy="336.8" r="0.9" fill="#F97316" opacity="0.16"/><circle cx="705.0" cy="158.5" r="1.4" fill="#F59E0B" opacity="0.25"/><circle cx="375.5" cy="292.1" r="1.8" fill="#F97316" opacity="0.35"/><circle cx="445.9" cy="371.4" r="1.6" fill="#F59E0B" opacity="0.36"/><circle cx="598.3" cy="373.5" r="2.5" fill="#F59E0B" opacity="0.45"/><circle cx="248.3" cy="335.1" r="2.5" fill="#F59E0B" opacity="0.45"/><circle cx="304.8" cy="280.8" r="1.1" fill="#F97316" opacity="0.52"/><circle cx="370.0" cy="365.7" r="2.4" fill="#F97316" opacity="0.32"/><circle cx="739.5" cy="270.7" r="1.4" fill="#F59E0B" opacity="0.23"/><circle cx="562.1" cy="411.7" r="1.6" fill="#F97316" opacity="0.21"/><circle cx="80.1" cy="161.5" r="1.2" fill="#F59E0B" opacity="0.33"/><circle cx="469.0" cy="125.5" r="2.9" fill="#F97316" opacity="0.16"/><circle cx="557.7" cy="150.7" r="1.2" fill="#F97316" opacity="0.38"/><circle cx="508.5" cy="427.7" r="1.4" fill="#F97316" opacity="0.53"/><circle cx="216.8" cy="246.3" r="2.9" fill="#F97316" opacity="0.30"/><circle cx="351.7" cy="164.6" r="2.3" fill="#F59E0B" opacity="0.16"/><circle cx="275.2" cy="230.9" r="0.9" fill="#F59E0B" opacity="0.50"/><circle cx="43.0" cy="339.6" r="1.6" fill="#F97316" opacity="0.22"/>

  <rect width="800" height="500" fill="url(#floor)"/>
  <rect width="800" height="500" filter="url(#grain)"/>

  <!-- Moldura e assinatura da casa -->
  <rect x="14" y="14" width="772" height="472" rx="14" fill="none" stroke="#F8E7C9" stroke-opacity="0.14" stroke-width="1.5"/>
  <g font-family="Montserrat, Arial, sans-serif">
    <text x="40" y="448" fill="#F8E7C9" fill-opacity="0.85" font-size="19" font-weight="700" letter-spacing="6">O CASARÃO</text>
    <text x="40" y="468" fill="#F59E0B" fill-opacity="0.7" font-size="10.5" font-weight="600" letter-spacing="4.2">EXPERIÊNCIAS AO VIVO</text>
  </g>
</svg>