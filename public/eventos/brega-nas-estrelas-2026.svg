<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#150c07"/>
      <stop offset="0.55" stop-color="#0d0805"/>
      <stop offset="1" stop-color="#090706"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.5" cy="1.05" r="0.9">
      <stop offset="0" stop-color="#B32616" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#B32616" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#B32616" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberHalo" cx="0.62" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8E7C9" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F8E7C9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A2414" stop-opacity="0"/>
      <stop offset="1" stop-color="#4A2414" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.97 0 0 0 0 0.9 0 0 0 0 0.78 0 0 0 0.05 0"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#ember)"/>
  <rect width="800" height="500" fill="url(#amberHalo)"/>

  <!-- Luzes de palco -->
  <polygon points="150,-10 90,300 330,300" fill="url(#beam)"/>
  <polygon points="620,-10 470,320 760,320" fill="url(#beam)"/>

  <!-- Motivo fantasma (textura de fundo) -->
  <g opacity="0.06" transform="translate(400 250) scale(2.6) translate(-400 -250)" stroke="#F8E7C9" fill="none">
    
  <rect x="486" y="128" width="88" height="118" rx="44" stroke="#F8E7C9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <g stroke="#F8E7C9" stroke-width="3" stroke-opacity="0.7">
    <line x1="500" y1="156" x2="560" y2="156"/>
    <line x1="496" y1="176" x2="564" y2="176"/>
    <line x1="496" y1="196" x2="564" y2="196"/>
    <line x1="500" y1="216" x2="560" y2="216"/>
  </g>
  <path d="M530 246 l0 52 m-36 0 l72 0" stroke="#F8E7C9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M646 108 L652.16 123.84 L668 130 L652.16 136.16 L646 152 L639.84 136.16 L624 130 L639.84 123.84 Z" fill="#F59E0B" fill-opacity="1" stroke="none"/> <path d="M432 98 L435.36 106.64 L444 110 L435.36 113.36 L432 122 L428.64 113.36 L420 110 L428.64 106.64 Z" fill="#F59E0B" fill-opacity="0.8" stroke="none"/> <path d="M688 200 L690.8 207.2 L698 210 L690.8 212.8 L688 220 L685.2 212.8 L678 210 L685.2 207.2 Z" fill="#F59E0B" fill-opacity="0.7" stroke="none"/> <path d="M414 200 L416.24 205.76 L422 208 L416.24 210.24 L414 216 L411.76 210.24 L406 208 L411.76 205.76 Z" fill="#F59E0B" fill-opacity="0.6" stroke="none"/>
  </g>

  

  <!-- Motivo principal -->
  <g filter="url(#glow)">
    
  <rect x="486" y="128" width="88" height="118" rx="44" stroke="#F8E7C9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <g stroke="#F8E7C9" stroke-width="3" stroke-opacity="0.7">
    <line x1="500" y1="156" x2="560" y2="156"/>
    <line x1="496" y1="176" x2="564" y2="176"/>
    <line x1="496" y1="196" x2="564" y2="196"/>
    <line x1="500" y1="216" x2="560" y2="216"/>
  </g>
  <path d="M530 246 l0 52 m-36 0 l72 0" stroke="#F8E7C9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M646 108 L652.16 123.84 L668 130 L652.16 136.16 L646 152 L639.84 136.16 L624 130 L639.84 123.84 Z" fill="#F59E0B" fill-opacity="1" stroke="none"/> <path d="M432 98 L435.36 106.64 L444 110 L435.36 113.36 L432 122 L428.64 113.36 L420 110 L428.64 106.64 Z" fill="#F59E0B" fill-opacity="0.8" stroke="none"/> <path d="M688 200 L690.8 207.2 L698 210 L690.8 212.8 L688 220 L685.2 212.8 L678 210 L685.2 207.2 Z" fill="#F59E0B" fill-opacity="0.7" stroke="none"/> <path d="M414 200 L416.24 205.76 L422 208 L416.24 210.24 L414 216 L411.76 210.24 L406 208 L411.76 205.76 Z" fill="#F59E0B" fill-opacity="0.6" stroke="none"/>
  </g>

  <circle cx="649.1" cy="434.1" r="1.2" fill="#F59E0B" opacity="0.37"/><circle cx="513.6" cy="141.4" r="1.2" fill="#F59E0B" opacity="0.52"/><circle cx="131.2" cy="217.9" r="1.2" fill="#F97316" opacity="0.50"/><circle cx="464.2" cy="356.6" r="1.4" fill="#F97316" opacity="0.34"/><circle cx="528.1" cy="202.9" r="2.5" fill="#F97316" opacity="0.53"/><circle cx="591.8" cy="243.6" r="1.1" fill="#F97316" opacity="0.39"/><circle cx="97.6" cy="349.5" r="2.5" fill="#F97316" opacity="0.38"/><circle cx="380.9" cy="130.3" r="1.8" fill="#F59E0B" opacity="0.17"/><circle cx="670.7" cy="144.2" r="2.0" fill="#F59E0B" opacity="0.24"/><circle cx="329.3" cy="439.4" r="2.3" fill="#F97316" opacity="0.53"/><circle cx="132.1" cy="270.3" r="1.3" fill="#F97316" opacity="0.38"/><circle cx="428.0" cy="266.2" r="1.7" fill="#F97316" opacity="0.52"/><circle cx="499.3" cy="333.0" r="1.0" fill="#F97316" opacity="0.38"/><circle cx="561.6" cy="329.6" r="1.3" fill="#F97316" opacity="0.31"/><circle cx="643.6" cy="316.3" r="2.7" fill="#F59E0B" opacity="0.37"/><circle cx="667.7" cy="377.0" r="1.2" fill="#F59E0B" opacity="0.42"/><circle cx="289.4" cy="334.8" r="2.0" fill="#F97316" opacity="0.43"/><circle cx="657.5" cy="321.3" r="0.8" fill="#F97316" opacity="0.29"/><circle cx="174.4" cy="278.0" r="2.8" fill="#F59E0B" opacity="0.23"/><circle cx="95.5" cy="312.6" r="1.3" fill="#F59E0B" opacity="0.34"/><circle cx="529.8" cy="307.7" r="2.8" fill="#F59E0B" opacity="0.30"/><circle cx="519.5" cy="382.7" r="1.7" fill="#F97316" opacity="0.30"/><circle cx="40.0" cy="289.7" r="1.7" fill="#F97316" opacity="0.53"/><circle cx="320.4" cy="302.3" r="2.1" fill="#F97316" opacity="0.45"/><circle cx="322.8" cy="397.8" r="2.6" fill="#F97316" opacity="0.22"/><circle cx="182.8" cy="292.7" r="1.1" fill="#F59E0B" opacity="0.13"/>

  <rect width="800" height="500" fill="url(#floor)"/>
  <rect width="800" height="500" filter="url(#grain)"/>

  <!-- Moldura e assinatura da casa -->
  <rect x="14" y="14" width="772" height="472" rx="14" fill="none" stroke="#F8E7C9" stroke-opacity="0.14" stroke-width="1.5"/>
  <g font-family="Montserrat, Arial, sans-serif">
    <text x="40" y="448" fill="#F8E7C9" fill-opacity="0.85" font-size="19" font-weight="700" letter-spacing="6">O CASARÃO</text>
    <text x="40" y="468" fill="#F59E0B" fill-opacity="0.7" font-size="10.5" font-weight="600" letter-spacing="4.2">EXPERIÊNCIAS AO VIVO</text>
  </g>
</svg>