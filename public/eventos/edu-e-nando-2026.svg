<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#150c07"/>
      <stop offset="0.55" stop-color="#0d0805"/>
      <stop offset="1" stop-color="#090706"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.5" cy="1.05" r="0.9">
      <stop offset="0" stop-color="#B32616" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#B32616" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#B32616" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberHalo" cx="0.62" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8E7C9" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F8E7C9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A2414" stop-opacity="0"/>
      <stop offset="1" stop-color="#4A2414" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.97 0 0 0 0 0.9 0 0 0 0 0.78 0 0 0 0.05 0"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#ember)"/>
  <rect width="800" height="500" fill="url(#amberHalo)"/>

  <!-- Luzes de palco -->
  <polygon points="150,-10 90,300 330,300" fill="url(#beam)"/>
  <polygon points="620,-10 470,320 760,320" fill="url(#beam)"/>

  <!-- Motivo fantasma (textura de fundo) -->
  <g opacity="0.06" transform="translate(400 250) scale(2.6) translate(-400 -250)" stroke="#F8E7C9" fill="none">
    
  
  <g transform="translate(462 170) scale(1)">
    <ellipse cx="0" cy="26" rx="62" ry="16" stroke="#F8E7C9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M-34 22 q-4 -44 34 -44 q38 0 34 44" stroke="#F8E7C9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M-34 12 q34 14 68 0" stroke="#F59E0B" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  
  <g transform="translate(600 230) scale(1.12)">
    <ellipse cx="0" cy="26" rx="62" ry="16" stroke="#F8E7C9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M-34 22 q-4 -44 34 -44 q38 0 34 44" stroke="#F8E7C9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M-34 12 q34 14 68 0" stroke="#F59E0B" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <path d="M512 322 q18 -26 44 -10 q26 16 10 40 q-14 20 -36 8 q-24 -14 -18 -38 z" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  

  <!-- Motivo principal -->
  <g filter="url(#glow)">
    
  
  <g transform="translate(462 170) scale(1)">
    <ellipse cx="0" cy="26" rx="62" ry="16" stroke="#F8E7C9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M-34 22 q-4 -44 34 -44 q38 0 34 44" stroke="#F8E7C9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M-34 12 q34 14 68 0" stroke="#F59E0B" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  
  <g transform="translate(600 230) scale(1.12)">
    <ellipse cx="0" cy="26" rx="62" ry="16" stroke="#F8E7C9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M-34 22 q-4 -44 34 -44 q38 0 34 44" stroke="#F8E7C9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M-34 12 q34 14 68 0" stroke="#F59E0B" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <path d="M512 322 q18 -26 44 -10 q26 16 10 40 q-14 20 -36 8 q-24 -14 -18 -38 z" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <circle cx="273.6" cy="124.0" r="2.4" fill="#F59E0B" opacity="0.18"/><circle cx="340.3" cy="253.0" r="2.0" fill="#F97316" opacity="0.36"/><circle cx="133.5" cy="277.2" r="0.9" fill="#F59E0B" opacity="0.19"/><circle cx="215.3" cy="138.4" r="2.0" fill="#F97316" opacity="0.38"/><circle cx="401.5" cy="264.2" r="1.0" fill="#F97316" opacity="0.55"/><circle cx="80.7" cy="217.0" r="2.0" fill="#F59E0B" opacity="0.37"/><circle cx="455.4" cy="436.4" r="1.7" fill="#F59E0B" opacity="0.50"/><circle cx="60.9" cy="354.5" r="1.6" fill="#F59E0B" opacity="0.21"/><circle cx="126.3" cy="244.9" r="1.0" fill="#F59E0B" opacity="0.34"/><circle cx="333.8" cy="404.8" r="1.7" fill="#F59E0B" opacity="0.13"/><circle cx="98.8" cy="230.9" r="1.7" fill="#F59E0B" opacity="0.31"/><circle cx="330.3" cy="387.7" r="2.6" fill="#F59E0B" opacity="0.15"/><circle cx="630.5" cy="390.3" r="2.1" fill="#F97316" opacity="0.21"/><circle cx="574.9" cy="239.8" r="1.7" fill="#F59E0B" opacity="0.41"/><circle cx="752.5" cy="351.9" r="2.6" fill="#F97316" opacity="0.28"/><circle cx="685.5" cy="419.5" r="0.9" fill="#F97316" opacity="0.32"/><circle cx="109.4" cy="407.9" r="1.5" fill="#F59E0B" opacity="0.57"/><circle cx="733.1" cy="164.2" r="1.1" fill="#F59E0B" opacity="0.33"/><circle cx="558.9" cy="199.0" r="2.6" fill="#F59E0B" opacity="0.52"/><circle cx="202.2" cy="122.0" r="1.5" fill="#F97316" opacity="0.36"/><circle cx="332.1" cy="171.4" r="2.6" fill="#F97316" opacity="0.32"/><circle cx="310.6" cy="395.5" r="1.0" fill="#F97316" opacity="0.37"/><circle cx="193.4" cy="368.7" r="1.7" fill="#F97316" opacity="0.27"/><circle cx="329.3" cy="400.1" r="0.9" fill="#F97316" opacity="0.30"/><circle cx="720.6" cy="395.8" r="2.7" fill="#F97316" opacity="0.37"/><circle cx="142.9" cy="214.7" r="2.5" fill="#F97316" opacity="0.35"/>

  <rect width="800" height="500" fill="url(#floor)"/>
  <rect width="800" height="500" filter="url(#grain)"/>

  <!-- Moldura e assinatura da casa -->
  <rect x="14" y="14" width="772" height="472" rx="14" fill="none" stroke="#F8E7C9" stroke-opacity="0.14" stroke-width="1.5"/>
  <g font-family="Montserrat, Arial, sans-serif">
    <text x="40" y="448" fill="#F8E7C9" fill-opacity="0.85" font-size="19" font-weight="700" letter-spacing="6">O CASARÃO</text>
    <text x="40" y="468" fill="#F59E0B" fill-opacity="0.7" font-size="10.5" font-weight="600" letter-spacing="4.2">EXPERIÊNCIAS AO VIVO</text>
  </g>
</svg>